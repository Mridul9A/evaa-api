<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EVAA Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin: 15px 0;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f5f9;
    }

    pre {
      background: #111827;
      color: #e5e7eb;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 20px;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>EVAA Demo</h1>

      <p class="subtitle">
        Event data ingestion using evaa-api + evaa-engine
      </p>

      <div class="upload-box">

        <p>Select an event dataset</p>

        <input
          id="fileInput"
          type="file"
          accept=".csv,.npy,.mat,.txt"
        />

        <br />

        <button id="uploadButton">
          Upload & Ingest
        </button>

      </div>

      <div id="status" class="status">
        Ready.
      </div>

      <pre id="result">No result yet.</pre>

    </div>

  </div>

  <script>

    const fileInput = document.getElementById('fileInput');
    const uploadButton = document.getElementById('uploadButton');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    uploadButton.addEventListener('click', async () => {

      const file = fileInput.files[0];

      if (!file) {
        status.textContent = 'Please select a file first.';
        status.className = 'status error';
        return;
      }

      const formData = new FormData();

      formData.append('file', file);

      uploadButton.disabled = true;

      status.textContent = `Uploading ${file.name}...`;
      status.className = 'status';

      result.textContent = 'Processing...';

      try {

        const response = await fetch('/api/ingest', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Upload failed');
        }

        status.textContent = 'Ingestion successful!';
        status.className = 'status success';

        result.textContent = JSON.stringify(
          data,
          null,
          2
        );

      } catch (error) {

        status.textContent = 'Ingestion failed.';
        status.className = 'status error';

        result.textContent = error.message;

      } finally {

        uploadButton.disabled = false;

      }

    });

  </script>

</body>
</html>
